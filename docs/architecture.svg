<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57534E"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#047857"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1D4ED8"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6D28D9"/></marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #1C1917; }
      .s { font-size: 12px; fill: #57534E; }
      .h { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
      .l { font-size: 11px; fill: #44403C; }
      .node { fill: #FFFFFF; stroke: #D6D3D1; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#1C1917">Shopfront Agent</text>
  <text x="190" y="38" font-size="15" fill="#57534E">any seller, buyable by any AI agent, paid through PayPal (sandbox)</text>

  <!-- Who uses it -->
  <rect x="20" y="64" width="292" height="700" rx="14" fill="#F5F5F4" stroke="#D6D3D1"/>
  <text x="38" y="90" class="h" fill="#57534E">WHO USES IT</text>
  <rect class="node" x="38" y="106" width="256" height="70" rx="10"/>
  <text x="54" y="134" class="t">Shopper + hosted AI agent</text><text x="54" y="155" class="s">/shop chat (Groq), approves in PayPal</text>
  <rect class="node" x="38" y="196" width="256" height="70" rx="10"/>
  <text x="54" y="224" class="t">Any MCP client</text><text x="54" y="245" class="s">e.g. Claude, with only the /mcp URL</text>
  <rect class="node" x="38" y="286" width="256" height="70" rx="10"/>
  <text x="54" y="314" class="t">PayPal Cart API client</text><text x="54" y="335" class="s">Store Sync's merchant contract</text>
  <rect class="node" x="38" y="400" width="256" height="70" rx="10"/>
  <text x="54" y="428" class="t">Seller on the web</text><text x="54" y="449" class="s">photos → listings, AG Grid dashboard</text>
  <rect class="node" x="38" y="490" width="256" height="70" rx="10"/>
  <text x="54" y="518" class="t">Seller on Telegram</text><text x="54" y="539" class="s">order pings, labels, refund taps</text>
  <rect class="node" x="38" y="604" width="256" height="70" rx="10"/>
  <text x="54" y="632" class="t">Judges and the public</text><text x="54" y="653" class="s">/live wire, /gauntlet, /developers</text>

  <!-- Shopfront on Render -->
  <rect x="372" y="64" width="456" height="700" rx="14" fill="#FFF7ED" stroke="#B4532A" stroke-width="1.4"/>
  <text x="390" y="90" class="h" fill="#9A3412">SHOPFRONT · ONE FREE RENDER WEB SERVICE (NEXT.JS)</text>
  <rect class="node" x="390" y="106" width="420" height="70" rx="10"/>
  <text x="406" y="134" class="t">/mcp · MCP server</text><text x="406" y="155" class="s">search, get, create_checkout: ids and quantities only</text>
  <rect class="node" x="390" y="196" width="420" height="70" rx="10"/>
  <text x="406" y="224" class="t">Cart API v1 · /api/paypal/v1/stores/{store}</text><text x="406" y="245" class="s">store-bound JWT, PayPal's validation codes, capture on ship</text>
  <rect class="node" x="390" y="286" width="420" height="70" rx="10"/>
  <text x="406" y="314" class="t">Seller studio · dashboard · Telegram webhook</text><text x="406" y="335" class="s">AG Grid overview, AG Studio report, Shop Manager (read-only)</text>
  <rect x="390" y="376" width="420" height="104" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="406" y="404" class="t">Money code (deterministic, unit-tested)</text>
  <text x="406" y="425" class="s">prices from the database · checkout state machine</text>
  <text x="406" y="444" class="s">refund policy · PayPal-Request-Id on every POST</text>
  <text x="406" y="463" class="s" font-weight="600" fill="#047857">the only code that creates, captures or refunds</text>
  <rect x="390" y="500" width="420" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="406" y="528" class="t">LLM router</text>
  <text x="406" y="549" class="s">cache → caps → Groq → Gemini → recorded replay</text>
  <text x="406" y="568" class="s" font-weight="600" fill="#6D28D9">proposes and drafts; has no tool that moves money</text>
  <rect class="node" x="390" y="610" width="420" height="70" rx="10"/>
  <text x="406" y="638" class="t">/webhooks/paypal · reconciliation · live wire</text><text x="406" y="659" class="s">signature-verified, processed once; books checked vs PayPal</text>
  <text x="390" y="716" class="l">Kept warm by UptimeRobot (2 min) + a GitHub Action (10 min);</text>
  <text x="390" y="733" class="l">deployed on every push to main.</text>

  <!-- PayPal -->
  <rect x="888" y="64" width="292" height="452" rx="14" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="906" y="90" class="h" fill="#1D4ED8">PAYPAL SANDBOX</text>
  <g>
    <rect class="node" x="906" y="104" width="256" height="44" rx="9"/><text x="922" y="131" class="t">Orders v2 · per-seller payee</text>
    <rect class="node" x="906" y="156" width="256" height="44" rx="9"/><text x="922" y="183" class="t">JS SDK v6 · buyer approval</text>
    <rect class="node" x="906" y="208" width="256" height="44" rx="9"/><text x="922" y="235" class="t">Payments v2 · capture, refund</text>
    <rect class="node" x="906" y="260" width="256" height="44" rx="9"/><text x="922" y="287" class="t">Webhooks · verify signature</text>
    <rect class="node" x="906" y="312" width="256" height="44" rx="9"/><text x="922" y="339" class="t">Catalog Products · tracking</text>
    <rect class="node" x="906" y="364" width="256" height="44" rx="9"/><text x="922" y="391" class="t">Transaction Search</text>
    <rect class="node" x="906" y="416" width="256" height="44" rx="9"/><text x="922" y="443" class="t">Log in with PayPal · OAuth</text>
  </g>
  <text x="906" y="482" class="l" fill="#047857">━ money code → PayPal: create, capture, refund</text>
  <text x="906" y="500" class="l" fill="#1D4ED8">┅ PayPal → Shopfront: signed webhook events</text>

  <!-- AI and data -->
  <rect x="888" y="536" width="292" height="104" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="906" y="562" class="h" fill="#6D28D9">AI · FREE TIERS</text>
  <text x="906" y="586" class="t">Groq · gpt-oss-120b</text><text x="906" y="604" class="s">agents, chat, the Shop Manager</text>
  <text x="906" y="626" class="t">Gemini · vision</text>
  <rect x="888" y="660" width="292" height="104" rx="14" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1.2"/>
  <text x="906" y="686" class="h" fill="#57534E">DATA</text>
  <text x="906" y="710" class="t">Neon Postgres (free)</text><text x="906" y="728" class="s">orders, events, images, call logs</text>
  <text x="906" y="746" class="s">Drizzle migrations</text>

  <!-- Arrows: users → Shopfront -->
  <g stroke="#57534E" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M294 141 H388"/>
    <path d="M294 231 C340 231 345 160 388 152"/>
    <path d="M294 321 C340 321 345 240 388 236"/>
    <path d="M294 435 C340 435 345 330 388 324"/>
    <path d="M294 525 C345 525 345 340 388 336"/>
    <path d="M294 639 C340 639 345 650 388 648"/>
  </g>
  <text x="300" y="134" class="l">MCP</text>
  <!-- Money code → PayPal -->
  <g stroke="#047857" stroke-width="1.8" fill="none" marker-end="url(#g)">
    <path d="M810 410 C850 410 860 130 904 126"/>
    <path d="M810 420 C855 420 860 230 904 230"/>
    <path d="M810 430 C855 430 862 334 904 334"/>
  </g>
  <!-- PayPal webhooks → Shopfront -->
  <g stroke="#1D4ED8" stroke-width="1.6" fill="none" marker-end="url(#b)" stroke-dasharray="5 4">
    <path d="M904 282 C860 290 870 640 812 645"/>
  </g>
  <!-- LLM router → AI -->
  <g stroke="#6D28D9" stroke-width="1.6" fill="none" marker-end="url(#p)">
    <path d="M810 545 C850 545 860 580 886 584"/>
  </g>
</svg>
